  # ────────────────────── Schemas ──────────────────────

  schemas:

    # ── Base Event Envelope ──

    EventEnvelope:
      type: object
      description: |
        Базовый конверт события.
        Все события ЦУП используют этот формат с одинаковыми обязательными полями.
        Поле type дискриминирует тип события, data содержит тип-специфичную нагрузку.
        correlationId пробрасывается для распределённой трассировки (см. ADR-005).
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор события (UUID v4). Используется для идемпотентности подписчиков.
        type:
          type: string
          description: Тип события — дискриминатор. Определяет структуру поля data.
        source:
          type: string
          description: Имя сервиса-отправителя (например, "notes", "tasks", "calendar").
        timestamp:
          type: string
          format: date-time
          description: Время публикации события в формате ISO 8601 (UTC).
        data:
          type: object
          description: Тело события — тип-специфичная нагрузка.
        correlationId:
          type: string
          format: uuid
          description: |
            Сквозной идентификатор для распределённой трассировки.
            Генерируется api-gateway для входящих запросов и пробрасывается через все события цепочки.
            Позволяет связать логи всех сервисов по одному correlationId.
        version:
          type: integer
          minimum: 1
          description: Версия схемы события. При breaking change версия инкрементируется.
      required:
        - id
        - type
        - source
        - timestamp
        - data
        - correlationId
        - version
      examples:
        - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
          type: "notes.created"
          source: "notes"
          timestamp: "2026-07-30T14:00:00.000Z"
          data:
            id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
            title: "My new note"
            body_md: "# Hello\nWorld"
            tags: ["personal"]
            profile_ids: ["c3d4e5f6-a7b8-9012-cdef-123456789012"]
            archived: false
            created_at: "2026-07-30T14:00:00.000Z"
            updated_at: "2026-07-30T14:00:00.000Z"
          correlationId: "d4e5f6a7-b8c9-0123-defa-1234567890ab"
          version: 1

    # ── Payload Composition Helper ──

    EventTypeMixin:
      type: object
      properties:
        type:
          type: string
      required:
        - type

    VersionMixin:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
      required:
        - version

    # ── Profiles ──

    ProfileData:
      type: object
      description: Данные профиля.
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор профиля.
        name:
          type: string
          description: Отображаемое имя профиля (например, "Work", "Home", "Family").
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Цвет профиля в hex-формате (например, "#ff6b6b").
        is_default:
          type: boolean
          description: Флаг профиля по умолчанию.
        hidden:
          type: boolean
          description: Скрыт ли профиль из интерфейса.
      required:
        - id
        - name
        - color
        - is_default
        - hidden

    ProfileCreatedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["profiles.created"]
            data:
              $ref: "#/components/schemas/ProfileData"
          required:
            - type
            - data

    ProfileUpdatedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["profiles.updated"]
            data:
              $ref: "#/components/schemas/ProfileData"
          required:
            - type
            - data

    ProfileDeletedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["profiles.deleted"]
            data:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: ID удалённого профиля.
              required:
                - id
          required:
            - type
            - data

    # ── Settings ──

    SettingData:
      type: object
      description: Данные настройки (ключ-значение).
      properties:
        key:
          type: string
          description: Ключ настройки (например, "kanban_columns", "gen_model").
        value:
          type: string
          description: Значение настройки (JSON-encoded для сложных структур).
      required:
        - key
        - value

    SettingChangedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["settings.changed"]
            data:
              $ref: "#/components/schemas/SettingData"
          required:
            - type
            - data

    # ── Notes ──

    NoteData:
      type: object
      description: Данные заметки.
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор заметки.
        title:
          type: string
          description: Заголовок заметки.
        body_md:
          type: string
          description: Тело заметки в Markdown.
        tags:
          type: array
          description: Список тегов.
          items:
            type: string
        profile_ids:
          type: array
          description: Список профилей, к которым привязана заметка.
          items:
            type: string
            format: uuid
        linked_project_id:
          type: string
          format: uuid
          description: ID привязанного проекта (опционально).
          nullable: true
        linked_meeting_id:
          type: string
          format: uuid
          description: ID привязанной встречи (опционально).
          nullable: true
        linked_task_id:
          type: string
          format: uuid
          description: ID привязанной задачи (опционально).
          nullable: true
        archived:
          type: boolean
          description: Флаг архивации (мягкое удаление).
        created_at:
          type: string
          format: date-time
          description: Дата создания.
        updated_at:
          type: string
          format: date-time
          description: Дата последнего обновления.
      required:
        - id
        - title
        - body_md
        - tags
        - profile_ids
        - archived
        - created_at
        - updated_at

    NoteCreatedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["notes.created"]
            data:
              $ref: "#/components/schemas/NoteData"
          required:
            - type
            - data

    NoteUpdatedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["notes.updated"]
            data:
              $ref: "#/components/schemas/NoteData"
          required:
            - type
            - data

    NoteDeletedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["notes.deleted"]
            data:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: ID удалённой заметки.
              required:
                - id
          required:
            - type
            - data

    NoteTitleGeneratedData:
      type: object
      description: Результат AI-генерации заголовка заметки.
      properties:
        note_id:
          type: string
          format: uuid
          description: ID заметки, для которой сгенерирован заголовок.
        title:
          type: string
          description: Сгенерированный AI заголовок.
        tag:
          type: string
          description: Сгенерированный AI тег.
      required:
        - note_id
        - title
        - tag

    NoteTitleGeneratedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["notes.title_generated"]
            data:
              $ref: "#/components/schemas/NoteTitleGeneratedData"
          required:
            - type
            - data

    # ── Tasks ──

    TaskData:
      type: object
      description: Данные задачи.
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор задачи.
        title:
          type: string
          description: Название задачи.
        description:
          type: string
          description: Описание задачи.
          nullable: true
        status:
          type: string
          description: Статус задачи в Kanban.
          enum:
            - backlog
            - todo
            - in_progress
            - done
            - archived
        priority:
          type: integer
          minimum: 0
          description: Приоритет задачи (0 — наивысший).
        weight:
          type: integer
          minimum: 0
          description: Вес задачи (для оценок трудозатрат).
        assignee:
          type: string
          format: uuid
          description: ID исполнителя (profile_id).
          nullable: true
        deadline:
          type: string
          format: date-time
          description: Дедлайн задачи.
          nullable: true
        profile_ids:
          type: array
          description: Список профилей, к которым привязана задача.
          items:
            type: string
            format: uuid
        project_id:
          type: string
          format: uuid
          description: ID проекта (опционально).
          nullable: true
        tags:
          type: array
          description: Список тегов.
          items:
            type: string
        rank:
          type: number
          description: Ручной ранг для сортировки (drag-and-drop reorder).
        created_at:
          type: string
          format: date-time
          description: Дата создания.
        updated_at:
          type: string
          format: date-time
          description: Дата последнего обновления.
      required:
        - id
        - title
        - status
        - priority
        - weight
        - profile_ids
        - rank
        - created_at
        - updated_at

    TaskCreatedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["tasks.created"]
            data:
              $ref: "#/components/schemas/TaskData"
          required:
            - type
            - data

    TaskUpdatedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["tasks.updated"]
            data:
              $ref: "#/components/schemas/TaskData"
          required:
            - type
            - data

    TaskDeletedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["tasks.deleted"]
            data:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: ID удалённой задачи.
              required:
                - id
          required:
            - type
            - data

    TaskStatusChangedData:
      type: object
      description: Данные о смене статуса задачи.
      properties:
        taskId:
          type: string
          format: uuid
          description: ID задачи.
        oldStatus:
          type: string
          description: Предыдущий статус.
          enum:
            - backlog
            - todo
            - in_progress
            - done
            - archived
        newStatus:
          type: string
          description: Новый статус.
          enum:
            - backlog
            - todo
            - in_progress
            - done
            - archived
        task:
          type: object
          description: Полный снимок задачи (title, deadline, assigneeId, projectId, status).
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            status:
              type: string
            deadline:
              type: string
              format: date-time
              nullable: true
            assigneeId:
              type: string
              format: uuid
              nullable: true
            projectId:
              type: string
              format: uuid
              nullable: true
        changed_at:
          type: string
          format: date-time
          description: Время изменения статуса.
      required:
        - taskId
        - oldStatus
        - newStatus

    TaskStatusChangedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["tasks.status_changed"]
            data:
              $ref: "#/components/schemas/TaskStatusChangedData"
          required:
            - type
            - data

    TaskPrioritiesReorderedData:
      type: object
      description: Данные о переупорядочивании приоритетов задач.
      properties:
        tasks:
          type: array
          description: Новый порядок задач с рангами.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: ID задачи.
              rank:
                type: number
                description: Новый ранг сортировки.
            required:
              - id
              - rank
        reordered_at:
          type: string
          format: date-time
          description: Время переупорядочивания.
      required:
        - tasks
        - reordered_at

    TaskPrioritiesReorderedPayload:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum: ["tasks.priorities_reordered"]
            data:
              $ref: "#/components/schemas/TaskPrioritiesReorderedData"
          required:
            - type
            - data

    # ── Meetings ──

    MeetingData:
      type: object
      description: Данные встречи.
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор встречи.
        title:
          type: string
          description: Название встречи.
        description:
          type: string
          description: Описание встречи.
          nullable: true
        start_time:
          type: string
          format: date-time
          description: Дата и время начала.
        end_time:
          type: string
          format: date-time
          description: Дата и время окончания.
        all_day:
          type: boolean
          description: Флаг целодневной встречи.
        location:
          type: string
          description: Место проведения (или ссылка на видеоконференцию).
          nullable: true
        recurrence:
          type: string
          description: Правило повторения (RRULE или JSON-encoded recurrence rule).
          nullable: true
        profile_ids:
          type: array
          description: Список профилей, к которым привязана встреча.
          items:
            type: string
            format: uuid
        linked_project_id:
          type: string
          format: uuid
          description: ID привязанного проекта (опционально).
          nullable: true
        created_at:
          type: string
          format: date-time
          description: Дата создания.
        updated_at:
          type: string
          format: date-time
          description: Дата последнего обновления.
