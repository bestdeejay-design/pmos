asyncapi: "2.6.0"
id: urn:pmos:event-catalog
defaultContentType: application/json

info:
  title: ЦУП Event Catalog
  version: "1.0.0"
  description: |
    Канонический каталог событий ЦУП (Personal OS).
    Все сервисы общаются асинхронно через NATS JetStream с гарантией at-least-once delivery.
    Каждое событие — конверт (EventEnvelope) с обязательными полями: id, type, source,
    timestamp, data, correlationId, version.

    Publisher: сервис-владелец, публикующий событие после изменения своей сущности.
    Subscribers: сервисы, строящие read model'и и реагирующие на изменения.

    Доставка: at-least-once через NATS JetStream consumer ack.
    Dead letter: после 3 неудачных попыток сообщение помещается в {subject}.dlq.
    Идемпотентность: подписчик проверяет event.id в своей таблице processed_events.

    Связанные ADR: ADR-003 (Event-Driven Communication), ADR-005 (Observability).
  contact:
    name: ЦУП Architecture Team
  license:
    name: MIT

servers:
  nats:
    url: nats://nats:4222
    protocol: nats
    protocolVersion: "2.10"
    description: NATS JetStream event bus — единая шина событий ЦУП

tags:
  - name: profile
    description: Контекстные профили (Work, Home, Family, Friends)
  - name: setting
    description: Настройки приложения
  - name: note
    description: Markdown-заметки
  - name: task
    description: Kanban-задачи
  - name: meeting
    description: Встречи календаря
  - name: project
    description: Проекты
  - name: file
    description: Файлы
  - name: dictation
    description: AI-диктовка
  - name: agent
    description: AI-ассистент
  - name: core
    description: Базовые сервисы
  - name: ai
    description: AI-сервисы

x-implemented-wire-events:
  format: "pmos.<svc>.<resource>.<action>  (action in created|updated|deleted)"
  stream: TSSRUP
  note: >
    Автоматически публикуются CRUD-мутациями (scripts/gen-routes.mjs, emit()).
    Остальные события каталога ниже — 📋 запланированы (FEATURES/SAGA), каркасом не шлются.
    canonical subject example: pmos.notes.notes.created
    ⚠️ Wire-факт устанавливает ТОЛЬКО этот список (x-implemented-wire-events). Каналы ниже
    описывают плановую семантику в старом формате pmos.<resource>.<action> и не всегда совпадают
    с фактическим субъектом. Фактический субъект для settings — pmos.settings.settings.{created,updated,deleted};
    канал pmos.settings.changed НЕ публикуется (см. REVIEW.md §3).
    Dead-letter: любой subject из списка ниже при исчерпании maxDeliver (по умолчанию 3)
    дополнительно публикуется как {subject}.dlq платформенным @pmos/event-bus (subscribe()).
    Эти *.dlq subject'ы — тоже реальный wire-артефакт (не входят в канонический список, но
    управляются stateless-сервисом ops: GET /dlq, POST /dlq/:id/replay, см. SAGA.md §DLQ).
  subjects:
    - pmos.agent.message_created
    - pmos.agent.trigger_evaluated
    - pmos.ai-gateway.dictation.completed
    - pmos.ai-gateway.punctuation.restored
    - pmos.calendar.meetings.created
    - pmos.calendar.meetings.updated
    - pmos.calendar.meetings.deleted
    - pmos.calendar.templates.created
    - pmos.calendar.templates.updated
    - pmos.calendar.templates.deleted
    - pmos.email.imap.created
    - pmos.email.imap.updated
    - pmos.email.imap.deleted
    - pmos.external-calendars.calendars.created
    - pmos.external-calendars.calendars.updated
    - pmos.external-calendars.calendars.deleted
    - pmos.files.uploaded
    - pmos.files.files.updated
    - pmos.files.deleted
    - pmos.integrations.webhooks.created
    - pmos.integrations.webhooks.updated
    - pmos.integrations.webhooks.deleted
    - pmos.notes.templates.created
    - pmos.notes.templates.updated
    - pmos.notes.templates.deleted
    - pmos.notes.notes.created
    - pmos.notes.notes.updated
    - pmos.notes.notes.deleted
    - pmos.profiles.profiles.created
    - pmos.profiles.profiles.updated
    - pmos.profiles.profiles.deleted
    - pmos.projects.projects.created
    - pmos.projects.projects.updated
    - pmos.projects.projects.deleted
    - pmos.sync.sync-folders.created
    - pmos.sync.sync-folders.updated
    - pmos.sync.sync-folders.deleted
    - pmos.tasks.tasks.created
    - pmos.tasks.tasks.updated
    - pmos.tasks.tasks.deleted
    - pmos.tasks.templates.created
    - pmos.tasks.templates.updated
    - pmos.tasks.templates.deleted
    - pmos.time-tracking.timesheet.created
    - pmos.time-tracking.timesheet.updated
    - pmos.time-tracking.timesheet.deleted
    - pmos.time-tracking.pomodoro.created
    - pmos.time-tracking.pomodoro.updated
    - pmos.email.synced
    - pmos.email.converted_to_note
    - pmos.email.converted_to_task
    - pmos.external-calendars.external_events.created
    - pmos.external-calendars.external_event.linked
    - pmos.sync.folder_scanned
    - pmos.notes.title_generated
    - pmos.files.text_extracted
    - pmos.tasks.tasks.status_changed
    - pmos.export-import.import.imported
    - pmos.integrations.api-keys.created
    - pmos.settings.settings.created
    - pmos.settings.settings.updated
    - pmos.settings.settings.deleted

channels:

  # ────────────────────────── Profiles ──────────────────────────

  pmos.profiles.created:
    description: |
      Профиль создан.
      Публикуется profiles-service после INSERT в таблицу profiles.
      Все сервисы обновляют локальный кэш profile_ids → name.
    tags:
      - name: profile
      - name: core
    subscribe:
      operationId: onProfileCreated
      summary: Profile created
      message:
        $ref: "#/components/messages/ProfileCreated"
    x-service-owner: profiles
    x-dead-letter:
      subject: pmos.profiles.created.dlq
      maxRetries: 3

  pmos.profiles.updated:
    description: |
      Профиль обновлён.
      Публикуется profiles-service после UPDATE таблицы profiles.
    tags:
      - name: profile
      - name: core
    subscribe:
      operationId: onProfileUpdated
      summary: Profile updated
      message:
        $ref: "#/components/messages/ProfileUpdated"
    x-service-owner: profiles
    x-dead-letter:
      subject: pmos.profiles.updated.dlq
      maxRetries: 3

  pmos.profiles.deleted:
    description: |
      Профиль удалён.
      Публикуется profiles-service после DELETE из таблицы profiles.
      Подписчики должны удалить ссылки на profile_id из своих read model'ей.
    tags:
      - name: profile
      - name: core
    subscribe:
      operationId: onProfileDeleted
      summary: Profile deleted
      message:
        $ref: "#/components/messages/ProfileDeleted"
    x-service-owner: profiles
    x-dead-letter:
      subject: pmos.profiles.deleted.dlq
      maxRetries: 3

  # ────────────────────────── Settings ──────────────────────────

  pmos.settings.changed:
    description: |
      Настройка изменена.
      Публикуется settings-service после UPSERT в таблицу settings.
      Все сервисы перечитывают свою конфигурацию при получении.
    tags:
      - name: setting
      - name: core
    subscribe:
      operationId: onSettingChanged
      summary: Setting changed
      message:
        $ref: "#/components/messages/SettingChanged"
    x-service-owner: settings
    x-dead-letter:
      subject: pmos.settings.changed.dlq
      maxRetries: 3

  # ────────────────────────── Notes ──────────────────────────

  pmos.notes.created:
    description: |
      Заметка создана.
      Публикуется notes-service после INSERT в таблицу notes.
      search-rag: индексирует текст заметки (embedding).
      agent: проверяет триггеры (meeting_ended → предложение создать заметку уже обработано).
    tags:
      - name: note
    subscribe:
      operationId: onNoteCreated
      summary: Note created
      message:
        $ref: "#/components/messages/NoteCreated"
    x-service-owner: notes
    x-dead-letter:
      subject: pmos.notes.created.dlq
      maxRetries: 3

  pmos.notes.updated:
    description: |
      Заметка обновлена.
      Публикуется notes-service после UPDATE таблицы notes.
      search-rag: переиндексирует embedding.
    tags:
      - name: note
    subscribe:
      operationId: onNoteUpdated
      summary: Note updated
      message:
        $ref: "#/components/messages/NoteUpdated"
    x-service-owner: notes
    x-dead-letter:
      subject: pmos.notes.updated.dlq
      maxRetries: 3

  pmos.notes.deleted:
    description: |
      Заметка удалена.
      Публикуется notes-service после DELETE из таблицы notes.
      search-rag: удаляет embedding.
      files: удаляет связи file → note.
    tags:
      - name: note
    subscribe:
      operationId: onNoteDeleted
      summary: Note deleted
      message:
        $ref: "#/components/messages/NoteDeleted"
    x-service-owner: notes
    x-dead-letter:
      subject: pmos.notes.deleted.dlq
      maxRetries: 3

  pmos.notes.title_generated:
    description: |
      AI-генерация заголовка заметки завершена.
      Публикуется ai-gateway (через notes-service) после успешной генерации.
      api-gateway: пушит результат клиенту через WebSocket.
    tags:
      - name: note
      - name: ai
    subscribe:
      operationId: onNoteTitleGenerated
      summary: Note title generated
      message:
        $ref: "#/components/messages/NoteTitleGenerated"
    x-service-owner: notes
    x-dead-letter:
      subject: pmos.notes.title_generated.dlq
      maxRetries: 3

  # ────────────────────────── Tasks ──────────────────────────

  pmos.tasks.created:
    description: |
      Задача создана.
      Публикуется tasks-service после INSERT в таблицу tasks.
      search-rag: индексирует задачу.
      agent: проверяет триггеры (deadline_soon, task_no_assignee).
      projects: актуализирует dashboard проекта.
    tags:
      - name: task
    subscribe:
      operationId: onTaskCreated
      summary: Task created
      message:
        $ref: "#/components/messages/TaskCreated"
    x-service-owner: tasks
    x-dead-letter:
      subject: pmos.tasks.created.dlq
      maxRetries: 3

  pmos.tasks.updated:
    description: |
      Задача обновлена.
      Публикуется tasks-service после UPDATE таблицы tasks.
    tags:
      - name: task
    subscribe:
      operationId: onTaskUpdated
      summary: Task updated
      message:
        $ref: "#/components/messages/TaskUpdated"
    x-service-owner: tasks
    x-dead-letter:
      subject: pmos.tasks.updated.dlq
      maxRetries: 3

  pmos.tasks.deleted:
    description: |
      Задача удалена.
      Публикуется tasks-service после DELETE из таблицы tasks.
    tags:
      - name: task
    subscribe:
      operationId: onTaskDeleted
      summary: Task deleted
      message:
        $ref: "#/components/messages/TaskDeleted"
    x-service-owner: tasks
    x-dead-letter:
      subject: pmos.tasks.deleted.dlq
      maxRetries: 3

  pmos.tasks.status_changed:
    description: |
      Статус задачи изменён.
      Публикуется tasks-service при смене статуса (backlog → todo → in_progress → done).
      Отдельное событие (не дублирует tasks.updated) для удобства подписчиков,
      которым важно только изменение статуса.
      agent: проверяет триггер deadline_soon (статус всё ещё не done).
    tags:
      - name: task
    subscribe:
      operationId: onTaskStatusChanged
      summary: Task status changed
      message:
        $ref: "#/components/messages/TaskStatusChanged"
    x-service-owner: tasks
    x-dead-letter:
      subject: pmos.tasks.status_changed.dlq
      maxRetries: 3

  pmos.tasks.priorities_reordered:
    description: |
      Порядок приоритетов задач изменён.
      Публикуется tasks-service после ручного drag-and-drop reorder.
      Клиент получает через WebSocket для немедленного обновления UI.
    tags:
      - name: task
    subscribe:
      operationId: onTaskPrioritiesReordered
      summary: Task priorities reordered
      message:
        $ref: "#/components/messages/TaskPrioritiesReordered"
    x-service-owner: tasks
    x-dead-letter:
      subject: pmos.tasks.priorities_reordered.dlq
      maxRetries: 3

  # ────────────────────────── Meetings ──────────────────────────

  pmos.meetings.created:
    description: |
      Встреча создана.
      Публикуется calendar-service после INSERT в таблицу meetings.
      search-rag: индексирует встречу.
      agent: проверяет пересечения и предлагает действия.
    tags:
      - name: meeting
    subscribe:
      operationId: onMeetingCreated
      summary: Meeting created
      message:
        $ref: "#/components/messages/MeetingCreated"
    x-service-owner: calendar
    x-dead-letter:
      subject: pmos.meetings.created.dlq
      maxRetries: 3

  pmos.meetings.updated:
    description: |
      Встреча обновлена.
      Публикуется calendar-service после UPDATE таблицы meetings.
    tags:
      - name: meeting
    subscribe:
      operationId: onMeetingUpdated
      summary: Meeting updated
      message:
        $ref: "#/components/messages/MeetingUpdated"
    x-service-owner: calendar
    x-dead-letter:
      subject: pmos.meetings.updated.dlq
      maxRetries: 3

  pmos.meetings.deleted:
    description: |
      Встреча удалена.
      Публикуется calendar-service после DELETE из таблицы meetings.
    tags:
      - name: meeting
    subscribe:
      operationId: onMeetingDeleted
      summary: Meeting deleted
      message:
        $ref: "#/components/messages/MeetingDeleted"
    x-service-owner: calendar
    x-dead-letter:
      subject: pmos.meetings.deleted.dlq
      maxRetries: 3

  pmos.meetings.reminder:
    description: |
      Напоминание о встрече сработало.
      Публикуется calendar-service по расписанию (fire_at).
      api-gateway: пушит напоминание клиенту через WebSocket.
    tags:
      - name: meeting
    subscribe:
      operationId: onMeetingReminder
      summary: Meeting reminder
      message:
        $ref: "#/components/messages/MeetingReminder"
    x-service-owner: calendar
    x-dead-letter:
      subject: pmos.meetings.reminder.dlq
      maxRetries: 3

  # ────────────────────────── Projects ──────────────────────────

  pmos.projects.created:
    description: |
      Проект создан.
      Публикуется projects-service после INSERT в таблицу projects.
      agent: запускает триггер project_plan (генерация плана на основе goal).
    tags:
      - name: project
    subscribe:
      operationId: onProjectCreated
      summary: Project created
      message:
        $ref: "#/components/messages/ProjectCreated"
    x-service-owner: projects
    x-dead-letter:
      subject: pmos.projects.created.dlq
      maxRetries: 3

  pmos.projects.updated:
    description: |
      Проект обновлён.
      Публикуется projects-service после UPDATE таблицы projects.
    tags:
      - name: project
    subscribe:
      operationId: onProjectUpdated
      summary: Project updated
      message:
        $ref: "#/components/messages/ProjectUpdated"
    x-service-owner: projects
    x-dead-letter:
      subject: pmos.projects.updated.dlq
      maxRetries: 3

  pmos.projects.deleted:
    description: |
      Проект удалён.
      Публикуется projects-service после DELETE из таблицы projects.
    tags:
      - name: project
    subscribe:
      operationId: onProjectDeleted
      summary: Project deleted
      message:
        $ref: "#/components/messages/ProjectDeleted"
    x-service-owner: projects
    x-dead-letter:
      subject: pmos.projects.deleted.dlq
      maxRetries: 3

  # ────────────────────────── Files ──────────────────────────

  pmos.files.uploaded:
    description: |
      Файл загружен.
      Публикуется files-service после завершения multipart upload.
      search-rag: начинает извлечение текста для семантической индексации.
    tags:
      - name: file
    subscribe:
      operationId: onFileUploaded
      summary: File uploaded
      message:
        $ref: "#/components/messages/FileUploaded"
    x-service-owner: files
    x-dead-letter:
      subject: pmos.files.uploaded.dlq
      maxRetries: 3

  pmos.files.updated:
    description: |
      Метаданные файла обновлены.
      Публикуется files-service после UPDATE таблицы file_meta.
    tags:
      - name: file
    subscribe:
      operationId: onFileUpdated
      summary: File updated
      message:
        $ref: "#/components/messages/FileUpdated"
    x-service-owner: files
    x-dead-letter:
      subject: pmos.files.updated.dlq
      maxRetries: 3

  pmos.files.deleted:
    description: |
      Файл удалён.
      Публикуется files-service после DELETE из таблицы file_meta.
      search-rag: удаляет embedding файла.
    tags:
      - name: file
    subscribe:
      operationId: onFileDeleted
      summary: File deleted
      message:
        $ref: "#/components/messages/FileDeleted"
    x-service-owner: files
    x-dead-letter:
      subject: pmos.files.deleted.dlq
      maxRetries: 3

  pmos.files.text_extracted:
    description: |
      Текст из файла извлечён.
      Публикуется files-service после успешного извлечения текста (для .txt, .md — прямой,
      для остальных — через OCR/text extraction).
      search-rag: создаёт embedding извлечённого текста.
    tags:
      - name: file
    subscribe:
      operationId: onFileTextExtracted
      summary: File text extracted
      message:
        $ref: "#/components/messages/FileTextExtracted"
    x-service-owner: files
    x-dead-letter:
      subject: pmos.files.text_extracted.dlq
      maxRetries: 3

  # ────────────────────────── AI / Dictation ──────────────────────────

  pmos.ai-gateway.dictation.completed:
    description: |
      Диктовка завершена.
      Публикуется ai-gateway после успешного распознавания речи и AI-форматирования
      (парсинг ТЕЛО: и ЗАГОЛОВОК: из ответа Ollama; при недоступности LLM — эвристика).
      api-gateway: пушит результат клиенту через WebSocket.
      agent: логирует завершение диктовки.
    tags:
      - name: dictation
      - name: ai
    subscribe:
      operationId: onDictationCompleted
      summary: Dictation completed
      message:
        $ref: "#/components/messages/DictationCompleted"
    x-service-owner: ai-gateway
    x-dead-letter:
      subject: pmos.ai-gateway.dictation.completed.dlq
      maxRetries: 3

  pmos.ai-gateway.punctuation.restored:
    description: |
      Восстановление пунктуации завершено.
      Публикуется ai-gateway после обработки текста (или graceful fallback —
      исходный текст без изменений при недоступности LLM).
    tags:
      - name: ai
    subscribe:
      operationId: onPunctuationRestored
      summary: Punctuation restored
      message:
        $ref: "#/components/messages/PunctuationRestored"
    x-service-owner: ai-gateway
    x-dead-letter:
      subject: pmos.ai-gateway.punctuation.restored.dlq
      maxRetries: 3

  # ────────────────────────── Agent ──────────────────────────

  pmos.agent.message_created:
    description: |
      Сообщение от AI-ассистента создано.
      Публикуется agent-service после генерации рекомендации/уведомления.
      api-gateway: пушит сообщение клиенту через WebSocket.
      integrations: отправляет webhook подписчикам.
    tags:
      - name: agent
      - name: ai
    subscribe:
      operationId: onAgentMessageCreated
      summary: Agent message created
      message:
        $ref: "#/components/messages/AgentMessageCreated"
    x-service-owner: agent
    x-dead-letter:
      subject: pmos.agent.message_created.dlq
      maxRetries: 3

  pmos.agent.trigger_evaluated:
    description: |
      Триггер AI-ассистента оценён.
      Публикуется agent-service при каждой проверке триггера (регулярной или событийной).
      Содержит результат проверки: сработал триггер или нет.
      Используется для логирования и отладки цепочек решений агента.
    tags:
      - name: agent
      - name: ai
    subscribe:
      operationId: onAgentTriggerEvaluated
      summary: Agent trigger evaluated
      message:
        $ref: "#/components/messages/AgentTriggerEvaluated"
    x-service-owner: agent
    x-dead-letter:
      subject: pmos.agent.trigger_evaluated.dlq
      maxRetries: 3

  # ────────────────────────── Email ──────────────────────────

  pmos.email.synced:
    description: |
      IMAP-аккаунт синхронизирован.
      Публикуется email-service после успешного POST /imap/{id}/sync.
      Содержит количество upsert'нутых писем.
    tags:
      - name: email
    subscribe:
      operationId: onEmailSynced
      summary: Email account synced
      message:
        $ref: "#/components/messages/EmailSynced"
    x-service-owner: email
    x-dead-letter:
      subject: pmos.email.synced.dlq
      maxRetries: 3

  pmos.email.converted_to_note:
    description: |
      Письмо конвертировано в заметку.
      Публикуется email-service после PATCH /imap/emails c convertTo: "note".
      notes-service консумирует событие и создаёт реальную заметку.
    tags:
      - name: email
      - name: note
    subscribe:
      operationId: onEmailConvertedToNote
      summary: Email converted to note
      message:
        $ref: "#/components/messages/EmailConvertedToNote"
    x-service-owner: email
    x-dead-letter:
      subject: pmos.email.converted_to_note.dlq
      maxRetries: 3

  pmos.email.converted_to_task:
    description: |
      Письмо конвертировано в задачу.
      Публикуется email-service после PATCH /imap/emails c convertTo: "task".
      tasks-service консумирует событие и создаёт реальную задачу.
    tags:
      - name: email
      - name: task
    subscribe:
      operationId: onEmailConvertedToTask
      summary: Email converted to task
      message:
        $ref: "#/components/messages/EmailConvertedToTask"
    x-service-owner: email
    x-dead-letter:
      subject: pmos.email.converted_to_task.dlq
      maxRetries: 3

  # ────────────────────── External Calendars ──────────────────────

  pmos.external-calendars.external_events.created:
    description: |
      Внешнее событие создано/импортировано из ICS.
      Публикуется external-calendars-service после POST /calendars/sync/{id}
      для каждого НОВОГО VEVENT.
      calendar-service консумирует событие и создаёт встречу (linked_meeting).
    tags:
      - name: calendar
    subscribe:
      operationId: onExternalEventCreated
      summary: External event created
      message:
        $ref: "#/components/messages/ExternalEventCreated"
    x-service-owner: external-calendars
    x-dead-letter:
      subject: pmos.external-calendars.external_events.created.dlq
      maxRetries: 3

  pmos.external-calendars.external_event.linked:
    description: |
      Внешнее событие связано с локальной встречей.
      Публикуется external-calendars-service после PATCH /calendars/events/{id}/link.
    tags:
      - name: calendar
    subscribe:
      operationId: onExternalEventLinked
      summary: External event linked to a meeting
      message:
        $ref: "#/components/messages/ExternalEventLinked"
    x-service-owner: external-calendars
    x-dead-letter:
      subject: pmos.external-calendars.external_event.linked.dlq
      maxRetries: 3

  # ────────────────────────── Sync ──────────────────────────

  pmos.sync.folder_scanned:
    description: |
      Папка синхронизации просканирована (фоновый auto-import).
      Публикуется sync-service после POST /sync-folders или PATCH /sync-folders/{id}
      при изменении path/autoImport. Содержит количество найденных .md файлов.
    tags:
      - name: file
      - name: sync
    subscribe:
      operationId: onSyncFolderScanned
      summary: Sync folder scanned
      message:
        $ref: "#/components/messages/SyncFolderScanned"
    x-service-owner: sync
    x-dead-letter:
      subject: pmos.sync.folder_scanned.dlq
      maxRetries: 3

