openapi: 3.1.0

info:
  title: AI Gateway Service
  version: 1.0.0
  description: >
    Единый прокси к LLM с fallback chain (Ollama локально, cloud опционально).

servers:
  - url: /api/ai-gateway/v1
    description: API Gateway route for ai-gateway service

paths:
  /restore-punctuation:
    post:
      operationId: restorePunctuation
      summary: Восстановить пунктуацию в тексте
      tags: [AI, Punctuation]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiTextRequest'
      responses:
        '200':
          description: Обработанный текст
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTextResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /dictate:
    post:
      operationId: dictate
      summary: 'Диктовка: текст → структурированное тело+заголовок+тег'
      tags: [AI, Dictation]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiTextRequest'
      responses:
        '200':
          description: Результат диктовки
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictationResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      description: Уникальный идентификатор для трассировки запроса
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    Offset:
      name: offset
      in: query
      required: false
      description: Смещение для пагинации (с какого элемента начинать)
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    Limit:
      name: limit
      in: query
      required: false
      description: Максимальное количество записей на страницу
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    # ─────────────────────── Error schemas ───────────────────────
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Человекочитаемое описание ошибки
        details:
          oneOf:
            - type: object
            - type: 'null'
          description: Дополнительная информация об ошибке

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
          example:
            code: VALIDATION_ERROR
            message: Некорректные данные запроса
            details:
              field: title
              constraint: required

    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [NOT_FOUND]
          example:
            code: NOT_FOUND
            message: Ресурс не найден
            details:
              resourceType: resource
              resourceId: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    InternalError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [INTERNAL_ERROR]
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервера

    # ─────────────────────── Pagination ───────────────────────
    Pagination:
      type: object
      required:
        - offset
        - limit
        - total
      properties:
        offset:
          type: integer
          description: Текущее смещение
        limit:
          type: integer
          description: Максимум записей на страницу
        total:
          type: integer
          description: Общее количество записей
      example:
        offset: 0
        limit: 20
        total: 5
    AiTextRequest:
      type: object
      description: Текстовый запрос к LLM
      required:
        - text
      properties:
        text:
          type: string
          description: 'Входной текст'
        model:
          type: string
          description: 'Модель (опционально, иначе fallback)'
    AiTextResponse:
      type: object
      description: Ответ LLM
      required:
        - text
      properties:
        text:
          type: string
          description: 'Обработанный текст'
        degraded:
          type: boolean
          description: 'true — внешний LLM недоступен, возвращён исходный текст без обработки'
      example:
        text: 'Привет, как дела?'
        degraded: false
    DictationResult:
      type: object
      description: Результат диктовки
      required:
        - title
        - bodyMd
      properties:
        title:
          type: string
          description: 'Заголовок'
        bodyMd:
          type: string
          description: 'Тело в Markdown'
        tag:
          type: string
          description: 'Предложенный тег'
        degraded:
          type: boolean
          description: 'true — LLM недоступен/ответ не распарсен, использованы эвристики'
      example:
        |-
          title: Купить молоко
          bodyMd: Нужно купить молоко и хлеб
          tag: shopping
          degraded: false

  responses:
    ValidationError:
      description: Ошибка валидации запроса
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    NotFoundError:
      description: Запрашиваемый ресурс не найден
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'

    InternalError:
      description: Внутренняя ошибка сервера
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
