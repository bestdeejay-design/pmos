openapi: 3.1.0

info:
  title: Projects Service
  version: 1.0.0
  description: >
    Группировка заметок, задач, встреч и файлов в проекты с Gantt-диаграммой.

servers:
  - url: /api/projects/v1
    description: API Gateway route for projects service

paths:
  /projects:
    post:
      operationId: createProject
      summary: Создать projects
      tags: [Project, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Создано
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      operationId: listProjects
      summary: Получить список projects
      tags: [Project, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'

      responses:
        '200':
          description: Список с пагинацией
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{id}:
    get:
      operationId: getProject
      summary: Получить projects по ID
      tags: [Project, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: UUID projects
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Данные
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      operationId: updateProject
      summary: Обновить projects (частично)
      tags: [Project, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: UUID projects
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Обновлено
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: deleteProject
      summary: Удалить projects
      tags: [Project, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: UUID projects
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Удалено (без тела)
          headers:
            x-correlation-id:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/items:
    get:
      operationId: getProjectItems
      summary: Элементы проекта (notes, tasks, meetings, files)
      tags: [Projects, Dashboard]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: UUID проекта
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Элементы проекта
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [notes, tasks, meetings, files]
                properties:
                  notes:
                    type: array
                    items:
                      type: object
                  tasks:
                    type: array
                    items:
                      type: object
                  meetings:
                    type: array
                    items:
                      type: object
                  files:
                    type: array
                    items:
                      type: object
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{id}/gantt:
    get:
      operationId: getProjectGantt
      summary: Gantt-диаграмма проекта
      tags: [Projects, Gantt]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: UUID проекта
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Задачи с датами и зависимостями
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      description: Уникальный идентификатор для трассировки запроса
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    Offset:
      name: offset
      in: query
      required: false
      description: Смещение для пагинации (с какого элемента начинать)
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    Limit:
      name: limit
      in: query
      required: false
      description: Максимальное количество записей на страницу
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    # ─────────────────────── Error schemas ───────────────────────
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Человекочитаемое описание ошибки
        details:
          oneOf:
            - type: object
            - type: 'null'
          description: Дополнительная информация об ошибке

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
          example:
            code: VALIDATION_ERROR
            message: Некорректные данные запроса
            details:
              field: title
              constraint: required

    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [NOT_FOUND]
          example:
            code: NOT_FOUND
            message: Ресурс не найден
            details:
              resourceType: resource
              resourceId: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    InternalError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [INTERNAL_ERROR]
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервера

    # ─────────────────────── Pagination ───────────────────────
    Pagination:
      type: object
      required:
        - offset
        - limit
        - total
      properties:
        offset:
          type: integer
          description: Текущее смещение
        limit:
          type: integer
          description: Максимум записей на страницу
        total:
          type: integer
          description: Общее количество записей
      example:
        offset: 0
        limit: 20
        total: 5
    Project:
      type: object
      description: Проект
      required:
        - id
        - name
        - status
        - profileIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        description: 'UUID записи'
        name:
          type: string
        description: 'Название проекта'
        description:
          type: string
        description: 'Описание'
        goal:
          type: string
        description: 'Цель'
        status:
          type: string
        description: 'Статус: active | archived | completed'
        profileIds:
          type: array
          items:
            type: string
            format: uuid
        description: 'UUID профилей'
        createdAt:
          type: string
          format: date-time
        description: 'Создано'
        updatedAt:
          type: string
          format: date-time
        description: 'Обновлено'
      example:
        |-
          id: p1a2b3c4-d5e6-7890-abcd-ef1234567890
          name: Ребрендинг
          description: Полный ребрендинг продукта
          goal: Запустить новый бренд к Q4
          status: active
          profileIds: [f1a2b3c4-d5e6-7890-abcd-ef1234567890]
          createdAt: '2026-07-01T10:00:00Z'
          updatedAt: '2026-07-30T12:00:00Z'
    ProjectCreate:
      type: object
      description: Данные для создания проекта
      required:
        - name
      properties:
        name:
          type: string
        description: 'Название'
        description:
          type: string
        description: 'Описание'
        goal:
          type: string
        description: 'Цель'
        status:
          type: string
        description: 'Статус'
        profileIds:
          type: array
          items:
            type: string
            format: uuid
        description: 'UUID профилей'
    ProjectUpdate:
      type: object
      description: Частичное обновление проекта
      required: []
      properties:
        name:
          type: string
        description: 'Название'
        description:
          type: string
        description: 'Описание'
        goal:
          type: string
        description: 'Цель'
        status:
          type: string
        description: 'Статус'
        profileIds:
          type: array
          items:
            type: string
            format: uuid
        description: 'UUID профилей'

  responses:
    ValidationError:
      description: Ошибка валидации запроса
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    NotFoundError:
      description: Запрашиваемый ресурс не найден
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'

    InternalError:
      description: Внутренняя ошибка сервера
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
