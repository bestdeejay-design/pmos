openapi: 3.1.0

info:
  title: Search & RAG Service
  version: 1.0.0
  description: >
    Полнотекстовый (ILIKE) и семантический (embedding) поиск по всем сущностям с graceful degradation.

servers:
  - url: /api/search-rag/v1
    description: API Gateway route for search-rag service

paths:
  /search:
    post:
      operationId: search
      summary: Поиск по всем сущностям
      tags: [Search]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQuery'
      responses:
        '200':
          description: Результаты поиска
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      description: Уникальный идентификатор для трассировки запроса
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    Offset:
      name: offset
      in: query
      required: false
      description: Смещение для пагинации (с какого элемента начинать)
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    Limit:
      name: limit
      in: query
      required: false
      description: Максимальное количество записей на страницу
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    # ─────────────────────── Error schemas ───────────────────────
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Человекочитаемое описание ошибки
        details:
          oneOf:
            - type: object
            - type: 'null'
          description: Дополнительная информация об ошибке

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
          example:
            code: VALIDATION_ERROR
            message: Некорректные данные запроса
            details:
              field: title
              constraint: required

    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [NOT_FOUND]
          example:
            code: NOT_FOUND
            message: Ресурс не найден
            details:
              resourceType: resource
              resourceId: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    InternalError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [INTERNAL_ERROR]
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервера

    # ─────────────────────── Pagination ───────────────────────
    Pagination:
      type: object
      required:
        - offset
        - limit
        - total
      properties:
        offset:
          type: integer
          description: Текущее смещение
        limit:
          type: integer
          description: Максимум записей на страницу
        total:
          type: integer
          description: Общее количество записей
      example:
        offset: 0
        limit: 20
        total: 5
    SearchQuery:
      type: object
      description: Запрос поиска
      required:
        - query
      properties:
        query:
          type: string
        description: 'Поисковый запрос'
        type:
          type: string
        description: 'Фильтр типа: note|task|meeting|file'
        tags:
          type: array
          items:
            type: string
        description: 'Tags filter'
        projectId:
          type: string
          format: uuid
        description: 'Фильтр проекта'
        profileIds:
          type: array
          items:
            type: string
            format: uuid
        description: 'Фильтр профилей'
        limit:
          type: integer
        description: 'Лимит результатов'
    SearchResult:
      type: object
      description: Результаты поиска
      required:
        - results
        - semantic
      properties:
        results:
          type: array
          items:
            type: object
        description: 'Найденные сущности'
        semantic:
          type: boolean
        description: 'Использован ли embedding-поиск'
        total:
          type: integer
        description: 'Всего найдено'
      example:
        |-
          results:
          - id: n1a2b3c4-d5e6-7890-abcd-ef1234567890
          type: note
          title: Купить молоко
          snippet: Нужно купить молоко...
          semantic: true
          total: 1

  responses:
    ValidationError:
      description: Ошибка валидации запроса
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    NotFoundError:
      description: Запрашиваемый ресурс не найден
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'

    InternalError:
      description: Внутренняя ошибка сервера
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
