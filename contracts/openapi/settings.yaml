openapi: 3.1.0

info:
  title: Settings Service
  version: 1.0.0
  description: >
    Хранилище ключ-значение (Shared Kernel) для настроек приложения, включая модели Ollama.

servers:
  - url: /api/settings/v1
    description: API Gateway route for settings service

paths:
  /settings:
    post:
      operationId: upsertSetting
      summary: Создать или обновить настройку (upsert)
      tags: [Settings, KV]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpsert'
      responses:
        '200':
          description: Настройка сохранена
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      operationId: listSettings
      summary: Получить все настройки
      tags: [Settings, KV]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Список настроек
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Setting'
        '500':
          $ref: '#/components/responses/InternalError'

  /settings/{key}:
    get:
      operationId: getSetting
      summary: Получить настройку по ключу
      tags: [Settings, KV]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: key
          in: path
          required: true
          description: Ключ настройки
          schema:
            type: string
      responses:
        '200':
          description: Значение настройки
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: deleteSetting
      summary: Удалить настройку
      tags: [Settings, KV]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: key
          in: path
          required: true
          description: Ключ настройки
          schema:
            type: string
      responses:
        '204':
          description: Удалено
          headers:
            x-correlation-id:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /settings/ollama-models:
    get:
      operationId: listOllamaModels
      summary: Список доступных моделей Ollama
      tags: [Settings, Models]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Список моделей
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: string
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      description: Уникальный идентификатор для трассировки запроса
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    Offset:
      name: offset
      in: query
      required: false
      description: Смещение для пагинации (с какого элемента начинать)
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    Limit:
      name: limit
      in: query
      required: false
      description: Максимальное количество записей на страницу
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    # ─────────────────────── Error schemas ───────────────────────
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Человекочитаемое описание ошибки
        details:
          oneOf:
            - type: object
            - type: 'null'
          description: Дополнительная информация об ошибке

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
          example:
            code: VALIDATION_ERROR
            message: Некорректные данные запроса
            details:
              field: title
              constraint: required

    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [NOT_FOUND]
          example:
            code: NOT_FOUND
            message: Ресурс не найден
            details:
              resourceType: resource
              resourceId: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    InternalError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [INTERNAL_ERROR]
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервера

    # ─────────────────────── Pagination ───────────────────────
    Pagination:
      type: object
      required:
        - offset
        - limit
        - total
      properties:
        offset:
          type: integer
          description: Текущее смещение
        limit:
          type: integer
          description: Максимум записей на страницу
        total:
          type: integer
          description: Общее количество записей
      example:
        offset: 0
        limit: 20
        total: 5
    Setting:
      type: object
      description: Ключ-значение настройка
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: 'Ключ настройки'
        value:
          type: object
          description: 'Значение (JSONB, произвольный объект)'
      example:
        |-
          key: gen_model
          value:
          name: qwen2.5-coder
          baseUrl: http://localhost:11434

  responses:
    ValidationError:
      description: Ошибка валидации запроса
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    NotFoundError:
      description: Запрашиваемый ресурс не найден
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'

    InternalError:
      description: Внутренняя ошибка сервера
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
