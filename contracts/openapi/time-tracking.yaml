openapi: 3.1.0

info:
  title: Time Tracking Service
  version: 1.0.0
  description: >
    Учёт времени: timesheet (лог) и pomodoro (сессии).

servers:
  - url: /api/time-tracking/v1
    description: API Gateway route for time-tracking service

paths:
  /timesheet:
    post:
      operationId: createTimesheet
      summary: Создать timesheet
      tags: [Timesheet, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetCreate'
      responses:
        '201':
          description: Создано
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      operationId: listTimesheets
      summary: Получить список timesheet
      tags: [Timesheet, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - name: taskId
          in: query
          required: false
          description: Фильтр по задаче (uuid)
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Начало диапазона
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Конец диапазона
          schema:
            type: string
      responses:
        '200':
          description: Список с пагинацией
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Timesheet'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '500':
          $ref: '#/components/responses/InternalError'

  /timesheet/{id}:
    get:
      operationId: getTimesheet
      summary: Получить timesheet по ID
      tags: [Timesheet, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: UUID timesheet
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Данные
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      operationId: updateTimesheet
      summary: Обновить timesheet (частично)
      tags: [Timesheet, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: UUID timesheet
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetUpdate'
      responses:
        '200':
          description: Обновлено
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: deleteTimesheet
      summary: Удалить timesheet
      tags: [Timesheet, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: UUID timesheet
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Удалено (без тела)
          headers:
            x-correlation-id:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /timesheet/stats:
    get:
      operationId: getTimesheetStats
      summary: Статистика времени
      tags: [Timesheet, Stats]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from
          in: query
          required: false
          description: Начало диапазона (date-time)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Конец диапазона (date-time)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Статистика
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  todayTotal:
                    type: integer
                  weekTotal:
                    type: integer
                  byTask:
                    type: array
                    items:
                      type: object
                  byProject:
                    type: array
                    items:
                      type: object
        '500':
          $ref: '#/components/responses/InternalError'

  /pomodoro:
    get:
      operationId: listPomodoro
      summary: Список pomodoro-сессий
      tags: [Pomodoro, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Сессии
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pomodoro'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: startPomodoro
      summary: Начать pomodoro-сессию
      tags: [Pomodoro, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PomodoroCreate'
      responses:
        '201':
          description: Сессия начата
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pomodoro'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /pomodoro/{id}:
    patch:
      operationId: updatePomodoro
      summary: Завершить/обновить pomodoro-сессию
      tags: [Pomodoro, CRUD]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          description: UUID сессии
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PomodoroUpdate'
      responses:
        '200':
          description: Обновлено
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pomodoro'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      description: Уникальный идентификатор для трассировки запроса
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    Offset:
      name: offset
      in: query
      required: false
      description: Смещение для пагинации (с какого элемента начинать)
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    Limit:
      name: limit
      in: query
      required: false
      description: Максимальное количество записей на страницу
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    # ─────────────────────── Error schemas ───────────────────────
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Человекочитаемое описание ошибки
        details:
          oneOf:
            - type: object
            - type: 'null'
          description: Дополнительная информация об ошибке

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
          example:
            code: VALIDATION_ERROR
            message: Некорректные данные запроса
            details:
              field: title
              constraint: required

    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [NOT_FOUND]
          example:
            code: NOT_FOUND
            message: Ресурс не найден
            details:
              resourceType: resource
              resourceId: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    InternalError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [INTERNAL_ERROR]
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервера

    # ─────────────────────── Pagination ───────────────────────
    Pagination:
      type: object
      required:
        - offset
        - limit
        - total
      properties:
        offset:
          type: integer
          description: Текущее смещение
        limit:
          type: integer
          description: Максимум записей на страницу
        total:
          type: integer
          description: Общее количество записей
      example:
        offset: 0
        limit: 20
        total: 5
    Timesheet:
      type: object
      description: Запись времени
      required:
        - id
        - startedAt
      properties:
        id:
          type: string
          format: uuid
          description: 'UUID записи'
        taskId:
          type: string
          format: uuid
          description: 'UUID задачи'
        description:
          type: string
          description: 'Описание записи'
        startedAt:
          type: string
          format: date-time
          description: 'Начало'
        endedAt:
          type: string
          format: date-time
          description: 'Конец'
        durationSec:
          type: integer
          description: 'Длительность в секундах'
        profileIds:
          type: array
          items:
            type: string
            format: uuid
          description: 'UUID профилей'
      example:
        |-
          id: t1a2b3c4-d5e6-7890-abcd-ef1234567890
          taskId: t1a2b3c4-d5e6-7890-abcd-ef1234567890
          description: Работа над документацией
          startedAt: '2026-07-30T10:00:00Z'
          endedAt: '2026-07-30T11:30:00Z'
          durationSec: 5400
          profileIds: [f1a2b3c4-d5e6-7890-abcd-ef1234567890]
    TimesheetCreate:
      type: object
      description: Данные для записи времени
      required:
        - startedAt
      properties:
        taskId:
          type: string
          format: uuid
          description: 'UUID задачи'
        description:
          type: string
          description: 'Описание'
        startedAt:
          type: string
          format: date-time
          description: 'Начало'
        endedAt:
          type: string
          format: date-time
          description: 'Конец'
        durationSec:
          type: integer
          description: 'Длительность'
        profileIds:
          type: array
          items:
            type: string
            format: uuid
          description: 'UUID профилей'
    TimesheetUpdate:
      type: object
      description: Частичное обновление записи
      required: []
      properties:
        endedAt:
          type: string
          format: date-time
          description: 'Конец'
        durationSec:
          type: integer
          description: 'Длительность'
    Pomodoro:
      type: object
      description: Pomodoro-сессия
      required:
        - id
        - mode
        - startedAt
      properties:
        id:
          type: string
          format: uuid
          description: 'UUID записи'
        mode:
          type: string
          description: 'Режим: pomodoro|flowtime|countdown'
        startedAt:
          type: string
          format: date-time
          description: 'Начало'
        endedAt:
          type: string
          format: date-time
          description: 'Конец'
        plannedMin:
          type: integer
          description: 'Плановые минуты'
        completed:
          type: boolean
          description: 'Завершён'
        taskId:
          type: string
          format: uuid
          description: 'UUID задачи'
      example:
        |-
          id: p1a2b3c4-d5e6-7890-abcd-ef1234567890
          mode: pomodoro
          startedAt: '2026-07-30T10:00:00Z'
          endedAt: '2026-07-30T10:25:00Z'
          plannedMin: 25
          completed: true
          taskId: t1a2b3c4-d5e6-7890-abcd-ef1234567890
    PomodoroCreate:
      type: object
      description: Данные для старта сессии
      required:
        - mode
      properties:
        mode:
          type: string
          description: 'Режим'
        plannedMin:
          type: integer
          description: 'Плановые минуты'
        taskId:
          type: string
          format: uuid
          description: 'UUID задачи'
    PomodoroUpdate:
      type: object
      description: Обновление сессии
      required: []
      properties:
        endedAt:
          type: string
          format: date-time
          description: 'Конец'
        completed:
          type: boolean
          description: 'Завершён'

  responses:
    ValidationError:
      description: Ошибка валидации запроса
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    NotFoundError:
      description: Запрашиваемый ресурс не найден
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'

    InternalError:
      description: Внутренняя ошибка сервера
      headers:
        x-correlation-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
