# ЦУП Personal OS — Docker Compose
# Profiles: core (infra) | phase1..4 (service groups) | all | monitoring
# Usage:
#   docker compose --profile core up -d
#   docker compose --profile all up -d
#   docker compose --profile all --profile monitoring up -d
# After boot, apply migrations per service:
#   pnpm --filter @pmos/notes run db:migrate   # repeat for each service

services:
  # ───────────────────────── Infrastructure ─────────────────────────
  postgres:
    # pgvector/pgvector:pg16 — includes the `vector` extension required by search-rag
    # (postgres:16-alpine does NOT ship pgvector; search-rag migrations would fail).
    image: pgvector/pgvector:pg16
    profiles: ["core", "all", "phase1", "phase2", "phase3", "phase4"]
    environment:
      POSTGRES_USER: pmos
      POSTGRES_PASSWORD: pmos
      POSTGRES_DB: pmos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmos"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    profiles: ["core", "all", "phase1", "phase2", "phase3", "phase4"]
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ───────────────────────── API Gateway (nginx) ─────────────────────────
  api-gateway:
    image: nginx:1.27-alpine
    profiles: ["all", "phase1", "phase2", "phase3", "phase4"]
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - nats
      - notes
      - tasks
      - calendar
      - projects
      - files
      - profiles
      - settings
      - search-rag
      - ai-gateway
      - agent
      - time-tracking
      - email
      - external-calendars
      - integrations
      - export-import
      - sync
      - ops
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ───────────────────────── Services (16) ─────────────────────────
  # Each service: build from services/<name>, internal port 3000,
  # host port per AGENT.md §4. Schema isolation via DATABASE_SCHEMA (ADR-004).
  notes:
    build:
      context: ../..
      dockerfile: platform/docker/Dockerfile.service
      args:
        SERVICE: notes
    profiles: ["phase1", "all"]
    ports: ["3001:3000"]
    environment:
      SERVICE_NAME: notes
      PORT: "3000"
      DATABASE_URL: postgres://pmos:pmos@postgres:5432/pmos
      DATABASE_SCHEMA: notes_
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
      OTEL_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  tasks:
