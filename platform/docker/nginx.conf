worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;

    # Internal (localhost / docker network) — no auth
    limit_req_zone $binary_remote_addr zone=internal:10m rate=100r/s;
    # Public API — 100 requests / minute per API key (ADR-001 / ADR-007 §2)
    limit_req_zone $http_authorization zone=public:10m rate=100r/m;

    upstream profiles_up    { server profiles:3000; }
    upstream settings_up    { server settings:3000; }
    upstream notes_up       { server notes:3000; }
    upstream tasks_up       { server tasks:3000; }
    upstream calendar_up    { server calendar:3000; }
    upstream projects_up    { server projects:3000; }
    upstream files_up       { server files:3000; }
    upstream search_up      { server search-rag:3000; }
    upstream ai_up          { server ai-gateway:3000; }
    upstream agent_up       { server agent:3000; }
    upstream time_up        { server time-tracking:3000; }
    upstream email_up       { server email:3000; }
    upstream extcal_up      { server external-calendars:3000; }
    upstream integrations_up{ server integrations:3000; }
    upstream export_up      { server export-import:3000; }
    upstream sync_up        { server sync:3000; }

    server {
        listen 8080;

        # SPA static files (mount at runtime if frontend built)
        location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
        location ~* \.(js|css|svg|woff2?)$ { add_header Cache-Control "public, immutable, max-age=31536000"; }

        location /api/health {
            return 200 '{"ok":true}';
            add_header Content-Type application/json;
        }

        # Public API (authenticated, rate-limited)
        location /api/v1/ {
            limit_req zone=public burst=20 nodelay;
            # API key validation handled by integrations service; gateway forwards
            proxy_pass http://integrations_up/;
            proxy_set_header X-Correlation-Id $request_id;
        }

        location /api/profiles/    { proxy_pass http://profiles_up/; }
        location /api/settings/    { proxy_pass http://settings_up/; }
        location /api/notes/       { proxy_pass http://notes_up/; }
        location /api/tasks/       { proxy_pass http://tasks_up/; }
        location /api/calendar/    { proxy_pass http://calendar_up/; }
        location /api/projects/    { proxy_pass http://projects_up/; }
        location /api/files/       { proxy_pass http://files_up/; }
        location /api/search/      { proxy_pass http://search_up/; }
        location /api/ai/          { proxy_pass http://ai_up/; }
        location /api/agent/       { proxy_pass http://agent_up/; }
        location /api/timesheet/   { proxy_pass http://time_up/; }
        location /api/pomodoro/    { proxy_pass http://time_up/; }
        location /api/imap/        { proxy_pass http://email_up/; }
        location /api/calendars/   { proxy_pass http://extcal_up/; }
        location /api/webhooks/    { proxy_pass http://integrations_up/; }
        location /api/api-keys/    { proxy_pass http://integrations_up/; }
        location /api/export/      { proxy_pass http://export_up/; }
        location /api/import/      { proxy_pass http://export_up/; }
        location /api/sync-folders/ { proxy_pass http://sync_up/; }

        # WebSocket
        location /ws {
            proxy_pass http://agent_up/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
