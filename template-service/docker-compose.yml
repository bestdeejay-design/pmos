version: "3.9"

services:
  template-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-template-service}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://user:password@postgres:5432/template_service}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "nats", "ping", "-c", "1"]
      interval: 5s
      timeout: 2s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: template_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d template_service"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
